<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تعديل المورد</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .resources-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .resource-form {
            background: #ffffff;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .submit-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .back-btn {
            display: inline-block;
            text-decoration: none;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="resources-container">

    <div class="resource-form">

        <h1>✏️ تعديل المورد</h1>

        <form method="POST">

            <div class="form-group">

                <label for="course_id">
                    المساق
                </label>

                <select
                    id="course_id"
                    name="course_id"
                    required
                >

                    {% for course in courses %}

                    <option
                        value="{{ course.id }}"
                        {% if course.id == resource.course_id %}selected{% endif %}
                    >
                        {{ course.name }} - {{ course.code }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="resource_type">
                    نوع المورد
                </label>

                <select
                    id="resource_type"
                    name="resource_type"
                    required
                >

                    <option value="book"
                        {% if resource.resource_type == 'book' %}selected{% endif %}>
                        📖 كتاب
                    </option>

                    <option value="slides"
                        {% if resource.resource_type == 'slides' %}selected{% endif %}>
                        📊 سلايدات
                    </option>

                    <option value="lecture"
                        {% if resource.resource_type == 'lecture' %}selected{% endif %}>
                        🎥 محاضرة
                    </option>

                    <option value="summary"
                        {% if resource.resource_type == 'summary' %}selected{% endif %}>
                        📝 ملخص
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="title">
                    عنوان المورد
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ resource.title }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="url">
                    رابط المورد
                </label>

                <input
                    type="url"
                    id="url"
                    name="url"
                    value="{{ resource.url }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">
                    الوصف
                </label>

                <textarea
                    id="description"
                    name="description"
                >{{ resource.description or '' }}</textarea>

            </div>


            <button
                type="submit"
                class="submit-btn"
            >
                💾 حفظ التعديلات
            </button>

        </form>


        <a
            href="{{ url_for('admin_resources') }}"
            class="back-btn"
        >
            ← العودة إلى إدارة الموارد
        </a>

    </div>

</div>

</body>
</html>
