<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .register-title {
            font-weight: 800;
            margin-bottom: 10px;
        }

        .register-subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
        }

        .btn-register {
            width: 100%;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="text-center">

        <h2 class="register-title">
            إنشاء حساب جديد
        </h2>

        <p class="register-subtitle">
            أنشئ حسابك للوصول إلى الخطط الدراسية
        </p>

    </div>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert alert-{{ category }} text-center">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                اسم المستخدم
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="اختر اسم مستخدم"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                كلمة المرور
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="اختر كلمة مرور"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                تأكيد كلمة المرور
            </label>

            <input
                type="password"
                name="confirm_password"
                class="form-control"
                placeholder="أعد كتابة كلمة المرور"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-primary btn-register"
        >
            إنشاء الحساب
        </button>

    </form>


    <div class="login-link">

        <span>
            لديك حساب بالفعل؟
        </span>

        <a href="{{ url_for('login') }}">
            تسجيل الدخول
        </a>

    </div>

</div>

</body>
</html>
